[package]
name = "oof-server"
description = "Open Online Framework server for Super Smash Bros. Ultimate 13.0.5 clients"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oof-server"
path = "src/main.rs"

[dependencies]
oof-nex = { path = "../oof-nex" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = "0.3"
