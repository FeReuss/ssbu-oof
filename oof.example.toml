# ssbu-oof server configuration. Copy to oof.toml and edit.

# HTTP + WebSocket listener. Ports connect the game's NEX WebSocket to "/" and call the
# account API under "/v1". Put a TLS terminator (Caddy, nginx, a cloud load balancer) in front
# for wss:// in production; see docs/STANDARD.md for what the port must trust.
listen = "0.0.0.0:8080"

# What clients use to reach this server; written into the secure-server station URL.
public_host = "127.0.0.1"
public_port = 8080

# 32+ random bytes as hex, shared by every node of the deployment. Generate with:
#   openssl rand -hex 32
secret = "REPLACE_WITH_64_HEX_CHARACTERS_REPLACE_WITH_64_HEX_CHARACTERS_00"

# ID token lifetime in seconds.
token_ttl_secs = 3600

# SQLite file for what must survive a restart: accounts, friends, bans and the players' DataStore records (SSBU keeps
# its online record in them, including disconnects and conduct warnings). Omit it to keep them in memory only.
database = "oof.db"

# Development only: take each client's public address from the station URLs it registers instead of the address its
# connections come from (several game instances on one machine, each with its own virtual address). Never enable it on
# a public server: clients could claim any address.
# trust_client_address = true

# NAT check used by Pia for NAT detection (the game's nncs1/nncs2 hosts); without it there are no online battles.
[nat_check]
# nncs1 and nncs2: two different public IPv4 addresses, each serving UDP 10025 and 10125 (nncs1 also 33334/33335).
# Pia needs both; the port reads them from GET /v1/status.
primary = "203.0.113.1"
secondary = "203.0.113.2"
# Behind 1:1 NAT (cloud elastic/reserved IPs) the host does not own the public addresses: bind these instead.
# primary_bind = "10.0.0.5"
# secondary_bind = "10.0.0.6"
# A host with one IPv4: serve nncs2 from another machine, which runs `oof-server nat-check 203.0.113.2` (add its
# local address as a second argument when it sits behind 1:1 NAT) and needs neither this file nor the secret.
# remote_secondary = true

# Online services the game switches on from the server (Utility 110/7 GetIntegerSettings, index 0). The game checks
# these keys before opening each online sequence and shows "service not available" when a key is not 1.
# docs/re/protocols.md, "Service switches". 9006 (Online Tourney) and 9007 (Spectator) open features ssbu-oof does not
# support yet: leave them off on a public server.
[integer_settings.0]
"9002" = 1
"9003" = 1
"9004" = 1
"9011" = 1
# "9006" = 1
# "9007" = 1

# Timed events (Utility 110/11): online tourneys and the online menu banner. `kinds` is a category bitmask (the menu
# asks for 4, the tourney screen for 3); a tourney runs from times[1] and each period is one session the game shows and
# lets players enter. Times are UTC. Layout and the parameter keys: docs/re/protocols.md, "Game events". A tourney's
# match rules are read from the current period's params (event-level rules are ignored: matches never end). Online
# Tourneys are not supported yet: events are for development.
# [[events]]
# id = 1
# kinds = 5
# title = "Weekend tourney"
# times = [2026-11-06T00:00:00Z, 2026-11-07T18:00:00Z, 2026-11-09T00:00:00Z, 2026-11-09T00:00:00Z]
# params = { tournament_entry_max_seconds = 60 }
# [[events.periods]]
# id = 1
# start = 2026-11-07T18:00:00Z
# end = 2026-11-07T22:00:00Z
# params = { time_sec = 180, stock = 3 }
